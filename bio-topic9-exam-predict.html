<script>
const DECK = [

// ===================== 9.1 HOMEOSTASIS =====================
{t:"9.1", id:"9.1-01", front:"Define homeostasis.", back:"The maintenance of a constant internal environment (physiological factors such as blood glucose, temperature, water potential, pH) within narrow limits, despite external or internal fluctuations."},
{t:"9.1", id:"9.1-02", front:"Describe the principle of negative feedback control.", back:"A change away from the normal (set point) value is detected by a receptor, which triggers a response that counteracts/reverses the change, returning the level back towards the normal set point — negative feedback maintains a stable equilibrium around that set point."},
{t:"9.1", id:"9.1-03", front:"Describe the principle of positive feedback, and give one biological example.", back:"Positive feedback amplifies a change AWAY from the normal level, rather than reversing it, until interrupted by some external or overriding factor. Example: during childbirth, stretching of the cervix stimulates release of oxytocin, which increases the strength of uterine contractions, which further stretches the cervix, releasing yet more oxytocin — this cycle continues until birth occurs."},
{t:"9.1", id:"9.1-04", front:"Name the four essential components of any negative feedback control system.", back:"1) A receptor (detects the change/stimulus), 2) a coordination system/communication pathway (e.g. nerves or hormones, carrying the information), 3) an effector (carries out the response, e.g. a muscle or gland), 4) restoration of the normal level, which is itself detected by the receptor, completing the loop."},
{t:"9.1", id:"9.1-05", front:"⚠ EXAMINER TRAP: A student describes homeostasis as keeping conditions 'exactly constant, never changing.' Why is this an oversimplification?", back:"Homeostasis maintains conditions within a narrow acceptable RANGE around a set point (dynamic equilibrium), not at a perfectly fixed, unchanging value — levels naturally fluctuate slightly above and below the set point and are continuously corrected back towards it, rather than never varying at all.", trap:true},

// ===================== 9.2 CHEMICAL CONTROL IN MAMMALS =====================
{t:"9.2", id:"9.2-01", front:"Compare nervous and hormonal (endocrine) communication in terms of speed and duration of effect.", back:"Nervous communication: very fast (electrical impulses along neurones), but the effect is short-lived/brief and acts on a very specific, localised target (the innervated cell). Hormonal communication: much slower (hormones travel dissolved in the blood), but the effect tends to be longer-lasting and can act more widely on multiple target cells/organs throughout the body that have the appropriate receptor."},
{t:"9.2", id:"9.2-02", front:"Explain why adrenaline, despite being unable to cross the cell membrane, can still cause changes inside liver and muscle cells.", back:"Adrenaline (the 'first messenger') binds to a specific complementary receptor protein on the OUTSIDE of the target cell's membrane. This binding activates an enzyme (adenylate cyclase) on the inside of the membrane, which converts ATP into cyclic AMP (cAMP) — cAMP acts as a 'second messenger' inside the cell, activating a cascade of enzyme reactions (e.g. activating protein kinase, which activates glycogen phosphorylase) that produce the cell's response, without adrenaline itself ever needing to enter the cell."},
{t:"9.2", id:"9.2-03", front:"Describe how adrenaline causes liver cells to increase the concentration of glucose in the blood.", back:"Adrenaline binds to its receptor on the liver cell membrane, activating adenylate cyclase, which converts ATP to cAMP inside the cell. cAMP activates a protein kinase enzyme cascade that ultimately activates glycogen phosphorylase, the enzyme that catalyses the breakdown (hydrolysis) of glycogen into glucose (glycogenolysis). This glucose is then released from the liver cell into the blood, increasing blood glucose concentration."},
{t:"9.2", id:"9.2-04", front:"Describe the role of insulin in lowering blood glucose concentration.", back:"When blood glucose concentration rises, insulin is released from the beta cells of the islets of Langerhans in the pancreas. Insulin binds to receptors on target cells (e.g. liver and muscle cells), increasing the number of glucose transporter proteins in the cell membrane (increasing glucose uptake) and activating enzymes that convert glucose into glycogen (glycogenesis) for storage, lowering blood glucose concentration."},
{t:"9.2", id:"9.2-05", front:"Describe the role of glucagon in raising blood glucose concentration.", back:"When blood glucose concentration falls, glucagon is released from the alpha cells of the islets of Langerhans. Glucagon binds to receptors on liver cells (via a second-messenger/cAMP mechanism, similar to adrenaline), activating enzymes that convert glycogen back into glucose (glycogenolysis) and stimulating gluconeogenesis (production of new glucose from non-carbohydrate sources, e.g. amino acids), raising blood glucose concentration."},
{t:"9.2", id:"9.2-06", front:"Explain how blood glucose concentration is controlled by negative feedback, referencing both insulin and glucagon.", back:"If blood glucose rises above the normal range, this is detected by the pancreas, which secretes MORE insulin and LESS glucagon, lowering blood glucose back towards normal. If blood glucose falls below the normal range, the pancreas secretes MORE glucagon and LESS insulin, raising blood glucose back towards normal — this antagonistic (opposing) hormone pair allows fine, bidirectional control around the set point."},
{t:"9.2", id:"9.2-07", front:"Explain the underlying cause of Type 1 diabetes, and how it differs from Type 2 diabetes.", back:"Type 1 diabetes: the immune system destroys the insulin-producing beta cells of the pancreas (an autoimmune condition), so little or no insulin is produced at all. Type 2 diabetes: the body still produces insulin, but target cells become less responsive to it (insulin resistance — often due to a reduced number/sensitivity of insulin receptors), so blood glucose is not effectively controlled despite insulin being present."},
{t:"9.2", id:"9.2-08", front:"Explain why Type 1 diabetes is typically treated with insulin injections, while Type 2 diabetes is often managed initially through diet/lifestyle changes.", back:"In Type 1 diabetes, since the body cannot produce insulin at all, external insulin must be supplied by injection to replace what is missing. In Type 2 diabetes, since insulin IS still produced but cells respond poorly to it, improving diet (reducing sugar/carbohydrate intake) and increasing exercise can improve insulin sensitivity and help manage blood glucose without necessarily requiring insulin injections, at least in earlier stages of the condition."},
{t:"9.2", id:"9.2-09", front:"⚠ EXAMINER TRAP: A student says adrenaline enters the liver cell to activate glycogen phosphorylase directly. Why is this wrong?", back:"Adrenaline NEVER enters the cell — it is a large, hydrophilic molecule and stays outside, binding to a surface receptor. It is the SECOND MESSENGER (cAMP), generated inside the cell as a result of that binding, which activates the internal enzyme cascade (not adrenaline itself acting inside the cell). Confusing 'first messenger acts outside, triggers an internal messenger' with 'the hormone itself enters and acts inside' is a very common conceptual error for cell-membrane-impermeable hormones.", trap:true},

// ===================== 9.3 CHEMICAL CONTROL IN PLANTS =====================
{t:"9.3", id:"9.3-01", front:"What is a plant tropism? Distinguish positive and negative tropism.", back:"A tropism is the directional growth response of a plant to an external stimulus (e.g. light, gravity). Positive tropism: growth TOWARDS the stimulus. Negative tropism: growth AWAY from the stimulus."},
{t:"9.3", id:"9.3-02", front:"Name the plant hormone responsible for phototropism, and describe how unequal distribution of this hormone causes a shoot to bend towards light.", back:"Auxin (indoleacetic acid, IAA). When light shines from one direction, auxin produced at the shoot tip is transported laterally to the SHADED side of the shoot, resulting in a higher auxin concentration on the shaded side than the illuminated side. Auxin stimulates cell elongation, so cells on the shaded side elongate more than cells on the illuminated side, causing the shoot to bend/curve towards the light (positive phototropism)."},
{t:"9.3", id:"9.3-03", front:"Explain how auxin distribution causes a root to bend downwards in response to gravity (positive gravitropism/geotropism in roots).", back:"When a root is placed horizontally, auxin becomes redistributed to accumulate on the LOWER side of the root due to gravity. Unlike in shoots, HIGH auxin concentration INHIBITS cell elongation in root cells, so cells on the lower side elongate less than cells on the upper side, causing the root to curve/grow downwards (towards gravity)."},
{t:"9.3", id:"9.3-04", front:"Explain why shoots show POSITIVE gravitropism in response to auxin accumulating on the lower side, while roots show the OPPOSITE response to the same auxin distribution.", back:"Root and shoot cells respond differently to the same concentration of auxin: in shoot cells, a higher auxin concentration STIMULATES cell elongation (so the lower, auxin-rich side of a horizontal shoot elongates more, curving the shoot UPWARDS, away from gravity — negative gravitropism); in root cells, the same higher auxin concentration INHIBITS cell elongation (so the lower side elongates less, curving the root DOWNWARDS, towards gravity — positive gravitropism). The differential sensitivity of shoot vs root cells to auxin explains the opposite directional responses."},
{t:"9.3", id:"9.3-05", front:"Describe the classic Cholodny-Went style experimental evidence (using agar blocks) that a diffusible chemical (auxin), not a physical/light-triggered structural response, is responsible for phototropic curvature.", back:"The shoot tip is removed and placed on an agar block for a period, allowing any diffusible chemical produced by the tip to diffuse into the agar block. The agar block (now containing that chemical, but with no shoot tip on it) is then placed off-centre on a decapitated shoot stump (in the dark, so light itself is not a factor for this test). If the stump curves even without a shoot tip present, this shows a diffusible chemical (rather than the physical tip structure or direct light exposure) is causing the growth response — the degree/direction of curvature further indicates the chemical's concentration and distribution determine the response."},
{t:"9.3", id:"9.3-06", front:"Give the role of gibberellins in stem elongation, and describe one commercial/agricultural use of gibberellins.", back:"Gibberellins promote stem elongation by stimulating cell elongation and cell division in stems. Commercially, gibberellins can be applied to crops to increase stem length/yield (e.g. in some fruit crops to increase fruit size, or to promote bolting/flowering), or gibberellin-INHIBITING chemicals can be applied to produce shorter, sturdier plants (e.g. reducing lodging/falling over in cereal crops) — plant breeders have also selected for naturally low-gibberellin dwarf varieties for similar reasons."},
{t:"9.3", id:"9.3-07", front:"Describe how gibberellin is involved in the germination of a cereal seed (e.g. barley).", back:"Gibberellin is released from the embryo and diffuses to the aleurone layer of the seed, where it stimulates the synthesis (via increased gene transcription/translation) of the enzyme amylase. Amylase then hydrolyses starch stored in the endosperm into maltose/glucose, which the embryo uses as a respiratory substrate/energy source to fuel the early growth of the germinating seedling."},
{t:"9.3", id:"9.3-08", front:"Explain why a mutant barley variety that cannot produce a functional gibberellin receptor would fail to germinate normally, even in the presence of gibberellin.", back:"Without a functional receptor, gibberellin cannot bind to and activate the signalling pathway inside the aleurone cells, even though the hormone itself is present. This means amylase gene transcription is not stimulated, so starch in the endosperm cannot be broken down into usable sugars for the embryo, and normal germination/early seedling growth cannot proceed."},
{t:"9.3", id:"9.3-09", front:"⚠ EXAMINER TRAP: A student says 'auxin always stimulates growth' as a blanket rule. Why is this an oversimplified and sometimes incorrect statement?", back:"Auxin's effect on cell elongation depends on BOTH the concentration of auxin AND the specific tissue type (shoot vs root cells respond differently to the same concentration) — at high concentrations, auxin can actually INHIBIT growth in root cells, and different tissues have different optimal/threshold concentrations. Exam questions frequently test this concentration- and tissue-dependent nuance specifically to catch students who over-generalise 'auxin = growth stimulant' without qualification.", trap:true},

// ===================== 9.4 MAMMALIAN NERVOUS SYSTEM =====================
{t:"9.4", id:"9.4-01", front:"Describe the overall organisation of the mammalian nervous system (CNS and PNS, and PNS subdivisions).", back:"The Central Nervous System (CNS) consists of the brain and spinal cord. The Peripheral Nervous System (PNS) consists of all the nerves connecting the CNS to the rest of the body, divided into the SOMATIC (voluntary) nervous system, controlling skeletal muscle under conscious control, and the AUTONOMIC (involuntary) nervous system, controlling involuntary processes (e.g. heart rate, digestion) — the autonomic system is further divided into the sympathetic and parasympathetic branches."},
{t:"9.4", id:"9.4-02", front:"Compare the sympathetic and parasympathetic branches of the autonomic nervous system.", back:"The sympathetic nervous system generally prepares the body for action ('fight or flight') — e.g. increasing heart rate, diverting blood to muscles, dilating pupils. The parasympathetic nervous system generally has the opposite, calming effect ('rest and digest') — e.g. decreasing heart rate, stimulating digestion. Most organs receive input from both branches, which act antagonistically (opposing each other) to allow fine control."},
{t:"9.4", id:"9.4-03", front:"Describe the structure and role of a reflex arc.", back:"A reflex arc is a neural pathway that produces a rapid, automatic (involuntary) response to a stimulus, without requiring conscious brain processing. The pathway typically runs: receptor → sensory neurone → (relay neurone in the spinal cord/CNS) → motor neurone → effector. Because the pathway is short (often bypassing the brain, being coordinated at the level of the spinal cord), the response is very fast, useful for protecting the body from potentially harmful stimuli."},
{t:"9.4", id:"9.4-04", front:"Describe the basic structure of a motor neurone.", back:"A motor neurone has a cell body (containing the nucleus) with dendrites receiving input, a long axon (often myelinated) that conducts the electrical impulse away from the cell body towards the target effector (e.g. a muscle), and motor end plates/axon terminals at the end that release neurotransmitter to stimulate the effector."},
{t:"9.4", id:"9.4-05", front:"State the function of Schwann cells / the myelin sheath around a neurone's axon.", back:"Schwann cells wrap around the axon, forming an insulating myelin sheath, which prevents ion movement across the membrane in the myelinated sections. This forces the electrical impulse to 'jump' between the gaps in the myelin (nodes of Ranvier) — saltatory conduction — greatly increasing the speed of nerve impulse transmission along the axon."},
{t:"9.4", id:"9.4-06", front:"⚠ EXAMINER TRAP: A student assumes ALL nervous responses are 'automatic and fast' like a reflex. Why is it important to distinguish reflex arcs from voluntary nervous responses?", back:"Reflex arcs are specifically fast and involuntary BECAUSE the pathway is short and typically coordinated at spinal cord level, bypassing conscious brain processing. VOLUNTARY responses (via the somatic nervous system, involving conscious decision-making in the brain) involve a longer pathway through the brain and are comparatively slower and consciously controlled. Treating every nervous response as if it were reflex-speed, or every reflex as if it required conscious thought, is a common conceptual confusion.", trap:true},

// ===================== 9.5 NERVOUS TRANSMISSION =====================
{t:"9.5", id:"9.5-01", front:"Describe how the resting potential of a neurone is established and maintained.", back:"The sodium-potassium pump actively transports (using ATP) 3 sodium ions (Na+) OUT of the axon for every 2 potassium ions (K+) pumped IN, against their concentration gradients. The membrane is also more permeable to K+ than Na+ (via potassium leak channels), so K+ diffuses back out faster than Na+ diffuses in. The combined effect of the pump and differential permeability establishes a resting potential of approximately −70 mV (inside negative relative to outside)."},
{t:"9.5", id:"9.5-02", front:"Describe the depolarisation phase of an action potential.", back:"A stimulus causes some voltage-gated sodium channels to open, allowing Na+ to diffuse into the axon down its concentration gradient. If the membrane potential reaches the threshold (around −55 mV), this triggers many more voltage-gated Na+ channels to open (positive feedback), causing a rapid influx of Na+ and a rapid rise in membrane potential (depolarisation) up to around +30 to +40 mV."},
{t:"9.5", id:"9.5-03", front:"Describe the repolarisation and hyperpolarisation phases of an action potential.", back:"At the peak of the action potential, voltage-gated sodium channels close (become inactivated) and voltage-gated potassium channels open, allowing K+ to diffuse OUT of the axon down its concentration gradient, causing the membrane potential to fall back down (repolarisation) towards the resting potential. The potassium channels are slightly slow to close, so slightly too much K+ leaves, causing the membrane potential to briefly become more negative than the resting potential (hyperpolarisation), before the sodium-potassium pump restores the resting potential fully."},
{t:"9.5", id:"9.5-04", front:"Explain what is meant by the 'all-or-nothing' principle of action potentials.", back:"If a stimulus is strong enough to depolarise the membrane to the threshold potential, a full action potential of the same fixed magnitude is always triggered, regardless of how much stronger the stimulus is beyond threshold. If the stimulus does not reach the threshold, no action potential occurs at all — there is no 'partial' or graded action potential."},
{t:"9.5", id:"9.5-05", front:"Explain the refractory period, and its functional significance.", back:"The refractory period is a brief period immediately after an action potential during which a new action potential cannot be triggered (absolute refractory period, while Na+ channels are inactivated) or can only be triggered by a stronger-than-normal stimulus (relative refractory period, during hyperpolarisation). This ensures action potentials only travel in ONE direction along the axon (preventing the impulse from triggering a new action potential back where it just came from) and limits the maximum frequency at which action potentials can be generated, allowing stimulus intensity to be encoded by frequency of impulses."},
{t:"9.5", id:"9.5-06", front:"Explain how the FREQUENCY of action potentials (rather than their size) is used to encode the intensity of a stimulus.", back:"Since all action potentials are the same fixed size (all-or-nothing principle), stimulus intensity cannot be encoded by varying the size of individual impulses. Instead, a STRONGER stimulus generates action potentials MORE FREQUENTLY (a higher frequency of impulses per second) along the same neurone, while a weaker stimulus generates them less frequently — the nervous system interprets a higher frequency of impulses as a more intense stimulus."},
{t:"9.5", id:"9.5-07", front:"Explain saltatory conduction, and why it makes nerve impulse conduction faster in myelinated neurones.", back:"In a myelinated axon, ion channels are concentrated at the nodes of Ranvier (gaps in the myelin sheath), since the insulating myelin elsewhere prevents ion movement across the membrane. The action potential effectively 'jumps' from node to node (saltatory conduction) rather than being regenerated continuously along every point of the membrane, which is much faster than conduction along an unmyelinated axon, where the action potential must be regenerated at every adjacent point along the entire membrane."},
{t:"9.5", id:"9.5-08", front:"Describe the structure of a synapse.", back:"A synapse is the junction between two neurones (or a neurone and an effector). It consists of the presynaptic neurone's axon terminal (containing synaptic vesicles filled with neurotransmitter), a small gap (the synaptic cleft) between the two cells, and the postsynaptic membrane, which contains specific neurotransmitter receptor proteins."},
{t:"9.5", id:"9.5-09", front:"Describe the events of synaptic transmission at a cholinergic (acetylcholine) synapse.", back:"An action potential arriving at the presynaptic terminal opens voltage-gated calcium channels, allowing Ca2+ to diffuse into the presynaptic neurone. This triggers synaptic vesicles containing acetylcholine to fuse with the presynaptic membrane (exocytosis), releasing acetylcholine into the synaptic cleft. Acetylcholine diffuses across the cleft and binds to specific receptors on the postsynaptic membrane, opening ligand-gated sodium channels, causing Na+ influx and depolarisation of the postsynaptic membrane (potentially triggering a new action potential if threshold is reached)."},
{t:"9.5", id:"9.5-10", front:"Explain why acetylcholinesterase is present in the synaptic cleft, and why its action is important.", back:"Acetylcholinesterase hydrolyses (breaks down) acetylcholine into choline and ethanoic (acetic) acid, removing it from the receptors and the synaptic cleft. This is essential to stop continuous stimulation of the postsynaptic membrane, allowing the synapse to reset and be ready to respond to the next new impulse — without this breakdown, acetylcholine would remain bound, causing continuous, uncontrolled depolarisation."},
{t:"9.5", id:"9.5-11", front:"Explain the importance of a synapse only transmitting an impulse in ONE direction.", back:"Neurotransmitter is only stored in vesicles in the PREsynaptic neurone and receptors are only present on the POSTsynaptic membrane, so the signal can only pass from pre- to postsynaptic cell, never in reverse. This ensures nerve impulses travel along a defined, one-way pathway through the nervous system, allowing coordinated, directional information flow (e.g. in a reflex arc)."},
{t:"9.5", id:"9.5-12", front:"Describe summation at a synapse, distinguishing spatial and temporal summation.", back:"Summation is the addition of the effects of multiple sub-threshold stimulations to reach the threshold needed to trigger a postsynaptic action potential. Spatial summation: several different presynaptic neurones each release a small amount of neurotransmitter onto the same postsynaptic cell simultaneously, and their combined effect reaches threshold. Temporal summation: a single presynaptic neurone releases neurotransmitter repeatedly, in quick succession, and the cumulative effect of these successive releases reaches threshold."},
{t:"9.5", id:"9.5-13", front:"⚠ EXAMINER TRAP: A student says the sodium-potassium pump 'causes' depolarisation during an action potential. Why is this a common but significant error?", back:"The sodium-potassium pump is responsible for establishing/maintaining the RESTING potential (via active transport, always running in the background) — it is NOT responsible for the rapid depolarisation seen during an action potential, which is instead caused by voltage-gated sodium channels opening and Na+ diffusing in passively (down its concentration gradient, no ATP needed for this specific step). Confusing the pump's slow, continuous, active role with the fast, passive, voltage-gated channel mechanism of an action potential is a very common and heavily-penalised mix-up.", trap:true},

// ===================== 9.6 EFFECTS OF DRUGS ON THE NERVOUS SYSTEM =====================
{t:"9.6", id:"9.6-01", front:"Define agonist and antagonist in the context of drugs acting at synapses.", back:"An agonist is a substance that binds to a receptor and MIMICS the natural neurotransmitter's effect, activating the receptor and triggering the same response as the neurotransmitter normally would. An antagonist is a substance that binds to a receptor WITHOUT activating it, but blocks the natural neurotransmitter from binding, preventing/reducing the normal response."},
{t:"9.6", id:"9.6-02", front:"Explain how nicotine acts as an agonist at cholinergic synapses.", back:"Nicotine has a molecular shape similar enough to acetylcholine that it can bind to and activate acetylcholine receptors on the postsynaptic membrane, mimicking acetylcholine's effect and triggering depolarisation of the postsynaptic membrane, even though it is not the natural neurotransmitter."},
{t:"9.6", id:"9.6-03", front:"Explain how a drug that inhibits acetylcholinesterase (e.g. some nerve agents/insecticides) affects synaptic transmission.", back:"If acetylcholinesterase is inhibited, acetylcholine is not broken down and removed from the synaptic cleft after release. This means acetylcholine remains bound to postsynaptic receptors for much longer than normal, causing prolonged, continuous depolarisation/stimulation of the postsynaptic membrane rather than the normal brief, discrete impulse — this can cause continuous, uncontrolled muscle contraction (as seen in nerve agent/organophosphate poisoning)."},
{t:"9.6", id:"9.6-04", front:"Explain how cocaine affects synaptic transmission at synapses using dopamine as the neurotransmitter.", back:"Cocaine blocks the reuptake transporter proteins responsible for removing dopamine from the synaptic cleft back into the presynaptic neurone after release. This means dopamine remains in the synaptic cleft for longer, continuing to bind to and stimulate postsynaptic receptors for an extended period, prolonging and intensifying the stimulatory effect (contributing to the intense, prolonged pleasurable/stimulant effects associated with cocaine use)."},
{t:"9.6", id:"9.6-05", front:"Explain how beta blockers (used to treat high blood pressure/heart conditions) act as antagonists.", back:"Beta blockers bind to beta-adrenergic receptors (the receptors normally activated by adrenaline/noradrenaline) on target cells such as those in the heart, WITHOUT activating them, blocking adrenaline/noradrenaline from binding and exerting their normal stimulatory effect — this reduces the stimulatory effect of the sympathetic nervous system on heart rate, helping to lower heart rate and blood pressure."},
{t:"9.6", id:"9.6-06", front:"⚠ EXAMINER TRAP: A student describes any drug that increases neurotransmitter activity at a synapse as an 'agonist', including drugs that block reuptake (like cocaine). Why is this an oversimplification worth being precise about?", back:"Strictly, an agonist directly binds to and activates the postsynaptic RECEPTOR itself, mimicking the neurotransmitter (e.g. nicotine at acetylcholine receptors). A reuptake inhibitor (e.g. cocaine) works by a DIFFERENT mechanism — it doesn't bind/activate the receptor itself, but instead blocks the removal of neurotransmitter from the cleft, indirectly prolonging the natural neurotransmitter's effect. Both increase net synaptic stimulation, but examiners often expect the specific, correct mechanism (direct receptor agonist vs reuptake inhibition) to be named precisely rather than lumped together as 'agonists'.", trap:true},

// ===================== 9.7 DETECTION OF LIGHT BY MAMMALS =====================
{t:"9.7", id:"9.7-01", front:"Compare the distribution and function of rod cells and cone cells in the retina.", back:"Rod cells: more numerous, distributed mainly around the periphery of the retina, very sensitive to light (function well in dim/low light conditions), but give only monochromatic (black-and-white) vision and lower visual acuity (detail). Cone cells: fewer in number, concentrated densely at the fovea, require brighter light to respond, but provide colour vision (three types, each sensitive to a different wavelength range) and much higher visual acuity."},
{t:"9.7", id:"9.7-02", front:"Explain why rod cells give lower visual acuity than cone cells, in terms of how they connect to bipolar/ganglion cells.", back:"Many rod cells typically converge onto (share) a single bipolar cell, and in turn onto a single ganglion cell/optic nerve fibre — this means the brain cannot distinguish exactly WHICH of the many rod cells in that group was stimulated, only that 'the group' was stimulated, reducing the precision/detail (acuity) of the image. In contrast, cone cells (especially at the fovea) typically have a much more one-to-one connection with bipolar and ganglion cells, allowing the brain to precisely pinpoint which individual cone was stimulated, giving much higher visual acuity."},
{t:"9.7", id:"9.7-03", front:"Explain why rod cells are more sensitive to light than cone cells, in terms of this same convergence/connectivity difference.", back:"Because many rod cells converge onto a single ganglion cell, the combined (summed) input from many rod cells — even if each individual rod only receives a small amount of light — can be enough to reach the threshold needed to trigger an action potential in the shared ganglion cell/optic nerve fibre (a form of spatial summation). This makes the rod pathway much more sensitive overall to very low light levels than the cone pathway, where each cone typically must generate enough signal individually (less summation) to trigger its own ganglion cell."},
{t:"9.7", id:"9.7-04", front:"Describe the process of phototransduction: how light striking rhodopsin in a rod cell ultimately leads to a nerve impulse.", back:"Light causes the photoreceptor pigment rhodopsin (made of the protein opsin bound to retinal) to change shape (retinal isomerises), which triggers a biochemical cascade eventually closing sodium ion channels in the rod cell's membrane. This REDUCES the inward flow of Na+ (which normally flows in continuously in the dark), causing the cell to become hyperpolarised. This change in membrane potential alters the rate of neurotransmitter release from the rod cell onto the bipolar cell, ultimately affecting the pattern of impulses sent along the optic nerve to the brain."},
{t:"9.7", id:"9.7-05", front:"Explain why, in the DARK, rod cells continuously release neurotransmitter, but in the LIGHT, they release less.", back:"In the dark, sodium channels in the rod cell membrane remain open (a 'dark current'), keeping the cell relatively depolarised, which causes continuous release of neurotransmitter onto the bipolar cell. When light strikes rhodopsin, this triggers closure of these sodium channels, causing hyperpolarisation of the rod cell and a REDUCTION in neurotransmitter release — the rod cell's response to light is therefore a DECREASE, not an increase, in neurotransmitter release, an important and counter-intuitive point in this subtopic."},
{t:"9.7", id:"9.7-06", front:"Give three types of cone cell and the approximate colour/wavelength of light each is most sensitive to.", back:"Three types exist, each containing a slightly different form of the photopigment (iodopsin), maximally sensitive to different wavelengths: 'blue' cones (short-wavelength, ~420 nm), 'green' cones (medium-wavelength, ~530 nm), and 'red' cones (long-wavelength, ~560 nm) — the combined pattern of relative stimulation across all three cone types allows the brain to perceive a full range of colours (trichromatic colour vision)."},
{t:"9.7", id:"9.7-07", front:"⚠ EXAMINER TRAP: A student says light causes rod cells to release MORE neurotransmitter (as a simple 'stimulus = more signal' assumption). Why is this backwards for photoreceptors specifically?", back:"Unlike most other sensory receptors (where a stimulus typically increases depolarisation and neurotransmitter release), rod (and cone) photoreceptors work in reverse: darkness = depolarised = MORE neurotransmitter release; light = hyperpolarised = LESS neurotransmitter release. Applying the generic 'stimulus increases signal' assumption without knowing this specific, counter-intuitive exception for photoreceptors is one of the most commonly tested traps in this subtopic.", trap:true},

// ===================== 9.8 CONTROL OF HEART RATE IN MAMMALS =====================
{t:"9.8", id:"9.8-01", front:"Name the two structures in the medulla oblongata involved in controlling heart rate, and state their general roles.", back:"The cardiovascular centre (or cardioregulatory centre) in the medulla oblongata contains two antagonistic control centres: one that sends impulses via the sympathetic nervous system (accelerator/cardiac nerve) to INCREASE heart rate, and one that sends impulses via the parasympathetic nervous system (vagus nerve) to DECREASE heart rate."},
{t:"9.8", id:"9.8-02", front:"Explain the role of baroreceptors in controlling heart rate.", back:"Baroreceptors, located in the walls of the carotid arteries and aorta, detect changes in blood pressure. If blood pressure rises above normal, baroreceptors send an increased frequency of impulses to the medulla, which increases parasympathetic (vagus nerve) stimulation and decreases sympathetic stimulation to the heart, DECREASING heart rate and reducing blood pressure back towards normal. If blood pressure falls, the opposite occurs, increasing heart rate."},
{t:"9.8", id:"9.8-03", front:"Explain the role of chemoreceptors in controlling heart rate.", back:"Chemoreceptors, located in the carotid bodies and aortic bodies (and also in the medulla itself), detect changes in blood pH/carbon dioxide concentration (and to a lesser extent oxygen concentration). A fall in blood pH (rise in CO2, e.g. during exercise) increases the frequency of impulses sent to the medulla, which increases sympathetic stimulation (and decreases parasympathetic stimulation) to the heart, INCREASING heart rate to help remove the excess CO2 more quickly via increased blood flow to the lungs."},
{t:"9.8", id:"9.8-04", front:"Describe the sequence of myogenic stimulation that generates each heartbeat.", back:"The sinoatrial node (SAN), the heart's natural pacemaker, generates a wave of electrical excitation that spreads across the atria, causing them to contract. This impulse reaches the atrioventricular node (AVN), which briefly delays it before passing it down specialised conducting tissue (the bundle of His) in the septum, and out through Purkyne fibres in the ventricle walls, causing the ventricles to contract from the base upwards."},
{t:"9.8", id:"9.8-05", front:"Explain why heart action is described as 'myogenic' rather than requiring continuous nervous stimulation to beat at all.", back:"Myogenic means the heart's contraction originates from within the heart muscle itself (specifically the SAN) rather than requiring an external nerve impulse to initiate every beat — the heart will continue to beat rhythmically even if disconnected from the nervous system (e.g. in a transplanted heart) because the SAN generates its own regular electrical impulses independently; the autonomic nervous system (sympathetic/parasympathetic) only MODIFIES the rate of this intrinsic beating, rather than being essential for the beat to occur at all."},
{t:"9.8", id:"9.8-06", front:"Explain how adrenaline (released during the 'fight or flight' response) affects heart rate, and by what mechanism.", back:"Adrenaline binds to specific beta-adrenergic receptors on the SAN (and other heart muscle cells), which — via a second messenger (cAMP) cascade — increases the rate at which the SAN generates electrical impulses, and increases the force of ventricular contraction, together increasing both heart rate and stroke volume/cardiac output, preparing the body for increased physical activity."},
{t:"9.8", id:"9.8-07", front:"⚠ EXAMINER TRAP: A student explains heart rate control using ONLY the SAN/AVN pathway, without mentioning the medulla or baroreceptor/chemoreceptor input. Why does this often lose marks on 'explain how heart rate changes during exercise' style questions?", back:"The SAN/AVN pathway explains HOW the heartbeat itself is generated and coordinated (myogenic stimulation), but does NOT by itself explain WHY heart rate changes in response to a physiological need like exercise. Full-mark answers on heart rate CONTROL/regulation (as opposed to simply describing one beat) need the full reflex arc: chemoreceptors/baroreceptors detect the change → medulla cardiovascular centre processes it → autonomic nerves (sympathetic/parasympathetic) adjust the RATE at which the SAN fires → SAN/AVN/bundle of His then coordinate the resulting beat. Missing the detection-and-nervous-control layer is a very common way to lose marks on these questions.", trap:true},

// ===================== 9.9 OSMOREGULATION AND TEMPERATURE REGULATION =====================
{t:"9.9", id:"9.9-01", front:"Describe the gross structure of the mammalian kidney (from outside in).", back:"Fibrous capsule (outer protective covering), cortex (outer region, containing the Bowman's capsules and convoluted tubules of the nephrons), medulla (inner region, containing the loops of Henle and collecting ducts), and pelvis (central cavity where urine collects before draining into the ureter)."},
{t:"9.9", id:"9.9-02", front:"Describe ultrafiltration at the glomerulus/Bowman's capsule.", back:"Blood enters the glomerulus (a knot of capillaries) via the afferent arteriole, which has a wider diameter than the efferent arteriole leaving it, creating high hydrostatic pressure within the glomerulus. This high pressure forces water, glucose, amino acids, ions and urea (small molecules) out of the capillary, through small gaps between capillary endothelial cells, a basement membrane (which acts as a filter, retaining large molecules like plasma proteins and blood cells), and podocyte cells of the Bowman's capsule, into the capsule space as filtrate."},
{t:"9.9", id:"9.9-03", front:"Describe selective reabsorption in the proximal convoluted tubule (PCT).", back:"Useful substances (glucose, amino acids, some ions, and most water) are reabsorbed from the filtrate back into the blood. Sodium ions are actively pumped out of the tubule cells into the blood, maintaining a concentration gradient that drives sodium (and co-transported glucose/amino acids) to move from the filtrate into the tubule cells (facilitated diffusion/co-transport), and then into the blood. The PCT has microvilli (increasing surface area) and many mitochondria (providing ATP for active transport), suiting it to this role. Water follows by osmosis, down the water potential gradient created by the reabsorbed solutes."},
{t:"9.9", id:"9.9-04", front:"Explain the role of the loop of Henle in creating a concentration (osmotic) gradient in the medulla, using the countercurrent multiplier mechanism.", back:"The ascending limb of the loop of Henle actively pumps sodium and chloride ions out into the surrounding medulla tissue (and is impermeable to water), progressively increasing the ion concentration/decreasing the water potential of the medulla tissue, especially deep in the medulla. The descending limb is permeable to water (but not actively pumping ions), so as filtrate flows down through the increasingly concentrated medulla, water is drawn OUT of the filtrate by osmosis, concentrating the filtrate in the descending limb. This countercurrent arrangement (fluid flowing in opposite directions in the two limbs) allows a much steeper, more efficient concentration gradient to build up in the medulla than could be achieved by a single-direction system."},
{t:"9.9", id:"9.9-05", front:"Explain the role of antidiuretic hormone (ADH) in controlling water reabsorption.", back:"ADH, released from the posterior pituitary gland in response to a rise in blood water potential/osmotic pressure detected by osmoreceptors in the hypothalamus, travels in the blood to the kidney, where it binds to receptors on the cells of the collecting duct (and distal convoluted tubule). This causes more aquaporin (water channel) proteins to be inserted into the cell membrane, increasing the permeability of the collecting duct to water — more water is therefore reabsorbed from the filtrate back into the blood by osmosis (following the concentration gradient established in the medulla), producing a smaller volume of more concentrated urine."},
{t:"9.9", id:"9.9-06", front:"Describe the negative feedback loop controlling blood water potential via ADH, when the body becomes dehydrated.", back:"A fall in blood water potential (dehydration) is detected by osmoreceptors in the hypothalamus, which stimulates the posterior pituitary gland to release MORE ADH. More ADH increases collecting duct permeability to water, increasing water reabsorption, producing a smaller volume of more concentrated urine and RAISING blood water potential back towards normal — once water potential returns to normal, less ADH is released, completing the negative feedback loop."},
{t:"9.9", id:"9.9-07", front:"Explain how furosemide (a diuretic drug that reduces active transport of sodium ions by the loop of Henle) increases urine production.", back:"By reducing active sodium/chloride pumping out of the ascending limb, furosemide reduces the concentration gradient (lower ion concentration) normally established in the medulla. With a less concentrated medulla, less water is drawn out of the collecting duct by osmosis (even in the presence of ADH and aquaporins), so more water remains in the filtrate, resulting in a larger volume of more dilute urine being produced."},
{t:"9.9", id:"9.9-08", front:"Describe the role of the hypothalamus as the body's thermoregulatory centre.", back:"The hypothalamus contains thermoreceptors that monitor the temperature of blood flowing through it (core body temperature), and also receives input from thermoreceptors in the skin (detecting external/skin temperature). Based on this information, the hypothalamus coordinates appropriate physiological responses (via nervous and hormonal pathways) to counteract any deviation from the normal core body temperature set point, via negative feedback."},
{t:"9.9", id:"9.9-09", front:"Describe two physiological responses to being TOO HOT (and how each helps lower body temperature).", back:"1) Vasodilation: arterioles supplying skin capillaries widen, increasing blood flow near the skin surface, increasing heat loss to the environment by radiation. 2) Sweating: sweat glands secrete more sweat onto the skin surface, and evaporation of this sweat requires latent heat (drawn from the skin), cooling the body."},
{t:"9.9", id:"9.9-10", front:"Describe two physiological responses to being TOO COLD (and how each helps raise/conserve body temperature).", back:"1) Vasoconstriction: arterioles supplying skin capillaries narrow, reducing blood flow near the skin surface, reducing heat loss to the environment. 2) Shivering: involuntary, rapid contraction of skeletal muscles generates heat as a by-product of the increased respiration needed to power these contractions, helping to raise body temperature."},
{t:"9.9", id:"9.9-11", front:"Analyse why an investigation into capsaicin (chilli extract) and sweat production would need to consider individual variation between the five test subjects, given error bars representing standard deviation were used.", back:"Individual differences (e.g. body mass, baseline sweat rate, sensitivity to capsaicin, fitness level) could cause genuine variation in sweat response between subjects independent of the dose given. Large error bars (standard deviation) at a given dose would indicate high variability between individuals' responses, meaning any apparent difference in mean sweat production between doses might not be a reliable, generalisable effect — overlapping error bars between two dose groups would suggest the difference between them may not be statistically meaningful, and a larger sample size would generally be needed to draw a more confident conclusion about capsaicin's effect on lowering temperature."},
{t:"9.9", id:"9.9-12", front:"⚠ EXAMINER TRAP: A student describes the loop of Henle's role using only 'it makes urine more concentrated' without explaining the actual countercurrent multiplier mechanism. Why does this lose most of the marks?", back:"Higher-mark questions on the loop of Henle specifically require the MECHANISM: active transport of ions OUT of the ascending limb (which is impermeable to water) progressively concentrates the surrounding medulla tissue, which then causes water to be drawn out of the descending limb (which IS permeable to water) by osmosis — and this whole process depends on the COUNTERCURRENT arrangement (opposite-direction flow in the two limbs) to build an increasingly steep gradient towards the tip of the loop. Simply stating the outcome ('urine becomes concentrated') without this ascending/descending, active-transport/osmosis, countercurrent detail misses the majority of available marking points.", trap:true},
];

const TABS = [
  {key:"9.1", label:"9.1 Homeostasis"},
  {key:"9.2", label:"9.2 Chemical Control (Mammals)"},
  {key:"9.3", label:"9.3 Chemical Control (Plants)"},
  {key:"9.4", label:"9.4 Nervous System"},
  {key:"9.5", label:"9.5 Nervous Transmission"},
  {key:"9.6", label:"9.6 Drugs & Nervous System"},
  {key:"9.7", label:"9.7 Detection of Light"},
  {key:"9.8", label:"9.8 Control of Heart Rate"},
  {key:"9.9", label:"9.9 Osmoregulation & Temp."},
];

const STORAGE_KEY = "bioT9ControlSystemsProgress";
let progress = {};
let activeTab = TABS[0].key;
let flippedIds = new Set();

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    progress = raw ? JSON.parse(raw) : {};
  }catch(e){ progress = {}; }
}
function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }
  catch(e){ /* storage unavailable — continue silently */ }
}

function renderTabs(){
  const bar = document.getElementById("tabBar");
  bar.innerHTML = "";
  TABS.forEach(tab=>{
    const cards = DECK.filter(c=>c.t===tab.key);
    const known = cards.filter(c=>progress[c.id]==="know").length;
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (tab.key===activeTab ? " active" : "");
    btn.innerHTML = tab.label + `<span class="count">${known}/${cards.length}</span>`;
    btn.onclick = ()=>{ activeTab = tab.key; flippedIds.clear(); renderAll(); };
    bar.appendChild(btn);
  });
}

function renderProgressBar(){
  const cards = DECK.filter(c=>c.t===activeTab);
  const known = cards.filter(c=>progress[c.id]==="know").length;
  const pct = cards.length ? Math.round((known/cards.length)*100) : 0;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent = `${known} / ${cards.length} known in this tab`;
  document.getElementById("tabTitle").textContent = TABS.find(t=>t.key===activeTab).label;
}

function renderStats(){
  const total = DECK.length;
  const known = DECK.filter(c=>progress[c.id]==="know").length;
  const review = DECK.filter(c=>progress[c.id]==="review").length;
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statKnown").textContent = known;
  document.getElementById("statReview").textContent = review;
}

function renderCards(){
  const container = document.getElementById("cardContainer");
  container.innerHTML = "";

  if(activeTab==="9.5"){
    const note = document.createElement("div");
    note.className = "section-note";
    note.innerHTML = "<b>Note:</b> 9.5 is the densest, most mechanism-heavy tab in this topic — resting potential, action potential phases, and synaptic transmission. Get the sodium-potassium pump (resting) vs voltage-gated channels (action potential) distinction rock solid first.";
    container.appendChild(note);
  }
  if(activeTab==="9.9"){
    const note = document.createElement("div");
    note.className = "section-note";
    note.innerHTML = "<b>Note:</b> 9.9 questions almost always want the full countercurrent multiplier MECHANISM for the loop of Henle, not just 'it concentrates urine' — practice writing the ascending/descending, active-transport/osmosis explanation in full every time.";
    container.appendChild(note);
  }

  const cards = DECK.filter(c=>c.t===activeTab);
  cards.forEach(c=>{
    const state = progress[c.id];
    const isFlipped = flippedIds.has(c.id);

    const el = document.createElement("div");
    el.className = "card" + (isFlipped ? " flipped" : "") + (state==="know" ? " known" : "") + (state==="review" ? " review" : "");

    const top = document.createElement("div");
    top.className = "card-top";
    const idEl = document.createElement("span");
    idEl.className = "card-id";
    idEl.textContent = c.id;
    top.appendChild(idEl);
    if(state){
      const chip = document.createElement("span");
      chip.className = "status-chip " + state;
      chip.textContent = state==="know" ? "✓ Known" : "↻ Review";
      top.appendChild(chip);
    }
    el.appendChild(top);

    if(c.trap){
      const badge = document.createElement("div");
      badge.className = "trap-badge";
      badge.textContent = "⚠ Examiner Trap";
      el.appendChild(badge);
    }

    const body = document.createElement("div");
    body.className = "card-body" + (isFlipped ? " answer" : "");
    if(!isFlipped){
      body.innerHTML = `<span class="label">Question</span>${c.front}`;
    } else {
      body.innerHTML = `<span class="label">Answer</span>${c.back}`;
    }
    el.appendChild(body);

    const hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = isFlipped ? "Tap to flip back" : "Tap card to reveal answer";
    el.appendChild(hint);

    el.onclick = (e)=>{
      if(e.target.closest(".st-btn")) return;
      if(flippedIds.has(c.id)) flippedIds.delete(c.id); else flippedIds.add(c.id);
      renderCards();
    };

    if(isFlipped){
      const st = document.createElement("div");
      st.className = "self-test";
      const knowBtn = document.createElement("button");
      knowBtn.className = "st-btn know-btn";
      knowBtn.textContent = "✓ I know this";
      knowBtn.onclick = (e)=>{ e.stopPropagation(); progress[c.id]="know"; saveProgress(); renderAll(); };
      const reviewBtn = document.createElement("button");
      reviewBtn.className = "st-btn review-btn";
      reviewBtn.textContent = "↻ Review again";
      reviewBtn.onclick = (e)=>{ e.stopPropagation(); progress[c.id]="review"; saveProgress(); renderAll(); };
      st.appendChild(knowBtn);
      st.appendChild(reviewBtn);
      el.appendChild(st);
    }

    container.appendChild(el);
  });
}

function renderAll(){
  renderTabs();
  renderProgressBar();
  renderStats();
  renderCards();
}

function resetProgress(){
  if(confirm("Reset all self-test progress for this deck? This can't be undone.")){
    progress = {};
    saveProgress();
    renderAll();
  }
}

loadProgress();
renderAll();
</script>
